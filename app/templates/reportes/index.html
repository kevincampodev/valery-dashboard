{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">Reportes</h2>
<div class="card card-body shadow-sm" style="max-width: 640px">
  <h5><i class="bi bi-file-earmark-spreadsheet text-success"></i> Reporte mensual en Excel</h5>
  <p class="text-muted">Un archivo con seis hojas: resumen del mes, ventas diarias, ventas por vendedora,
    deudas con proveedores (al día de hoy), abonos del mes y comisiones del mes.</p>
  <form method="get" action="{{ url_for('reportes.mensual') }}" class="d-flex gap-2">
    <input type="month" name="mes" value="{{ mes_actual }}" class="form-control" style="max-width: 220px">
    <button class="btn btn-success"><i class="bi bi-download"></i> Descargar</button>
  </form>
</div>
{% endblock %}
