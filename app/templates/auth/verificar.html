<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Ingresar · Panel administrativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="card shadow-sm" style="width: 100%; max-width: 380px">
    <div class="card-body p-4">
      <h4 class="mb-1"><i class="bi bi-shield-lock"></i> Panel administrativo</h4>
      <p class="text-muted small mb-4">Ingresa con tu usuario y contraseña.</p>

      {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensaje in mensajes %}
        <div class="alert alert-{{ categoria }} py-2 small">{{ mensaje }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario</label>
          <input id="usuario" name="usuario" class="form-control" autocomplete="username"
                 autocapitalize="none" spellcheck="false" maxlength="40" required autofocus>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" name="password" type="password" class="form-control"
                 autocomplete="current-password" maxlength="200" required>
        </div>
        <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Ingresar</button>
      </form>
    </div>
  </div>
</main>
</body>
</html>
