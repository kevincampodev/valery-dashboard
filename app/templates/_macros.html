{% macro badge_estado(estado) %}
  {% set colores = {'pagada': 'success', 'vencida': 'danger', 'por vencer': 'warning', 'al día': 'secondary'} %}
  <span class="badge bg-{{ colores.get(estado, 'secondary') }}">{{ estado|capitalize }}</span>
{% endmacro %}

{# Ícono de Lucide desde el sprite del panel #}
{% macro icono(nombre, clase='') %}<svg class="ico {{ clase }}" aria-hidden="true"><use href="{{ url_for('static', filename='img/iconos.svg') }}#{{ nombre }}"></use></svg>{% endmacro %}
