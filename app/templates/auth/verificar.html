<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Verificación · Panel administrativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="card shadow-sm" style="width: 100%; max-width: 380px">
    <div class="card-body p-4">
      <h4 class="mb-1"><i class="bi bi-phone"></i> Verificación en dos pasos</h4>
      <p class="text-muted small mb-4">Hola, {{ nombre }}. Escribe el código de 6 dígitos que muestra tu app de autenticación.</p>

      {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensaje in mensajes %}
        <div class="alert alert-{{ categoria }} py-2 small">{{ mensaje }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post" action="{{ url_for('auth.verificar') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-4">
          <label for="codigo" class="form-label">Código</label>
          <input id="codigo" name="codigo" class="form-control form-control-lg text-center"
                 inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7"
                 placeholder="000000" required autofocus>
        </div>
        <button class="btn btn-primary w-100"><i class="bi bi-check2-circle"></i> Verificar</button>
      </form>
      <a href="{{ url_for('auth.login') }}" class="d-block text-center small mt-3">Volver al inicio de sesión</a>
    </div>
  </div>
</main>
</body>
</html>
